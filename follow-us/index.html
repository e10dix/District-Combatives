<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Find District Combatives on Social Media</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#15171B;
    --surface:#1D2025;
    --surface-hover:#22262C;
    --line:#33383F;
    --text:#ECEDEE;
    --muted:#9AA0A6;
    --accent:#C4361E;
    --accent-hover:#A82C17;
  }

  * { box-sizing: border-box; }

  body { margin: 0; background: var(--bg); }

  /* ---- Site navigation ---- */
  nav {
    display: flex;
    gap: 28px;
    align-items: center;
    padding: 20px 24px;
    background: var(--bg);
    border-bottom: 1px solid var(--line);
    font-family: 'Barlow', -apple-system, sans-serif;
  }

  nav a {
    color: var(--muted);
    text-decoration: none;
    font-size: 0.95rem;
    font-weight: 500;
    padding: 4px 0;
    border-bottom: 2px solid transparent;
    transition: color 0.15s ease, border-color 0.15s ease;
  }

  nav a:hover,
  nav a:focus-visible {
    color: var(--text);
  }

  nav a.active {
    color: var(--text);
    border-bottom-color: var(--accent);
  }

  /* ---- This wrapper section is what you paste into your site as a "tab"/section ---- */
  .social-follow {
    background: var(--bg);
    color: var(--text);
    font-family: 'Barlow', -apple-system, sans-serif;
    padding: 72px 24px;
  }

  .social-follow__inner {
    max-width: 920px;
    margin: 0 auto;
  }

  .social-follow__label {
    font-family: 'Barlow Condensed', sans-serif;
    font-weight: 700;
    font-size: clamp(2rem, 4vw, 2.75rem);
    letter-spacing: 0.01em;
    margin: 0 0 8px;
    line-height: 1.05;
  }

  .social-follow__label span {
    color: var(--accent);
  }

  .social-follow__sub {
    color: var(--muted);
    font-size: 1.05rem;
    margin: 0 0 40px;
    max-width: 52ch;
  }

  .social-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
    gap: 16px;
  }

  .social-card {
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    gap: 24px;
    background: var(--surface);
    border: 1px solid var(--line);
    border-left: 3px solid var(--accent);
    padding: 24px;
    text-decoration: none;
    color: var(--text);
    transition: background-color 0.15s ease, transform 0.15s ease;
  }

  .social-card:hover,
  .social-card:focus-visible {
    background: var(--surface-hover);
    transform: translateY(-2px);
  }

  .social-card:focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 2px;
  }

  .social-card__icon {
    width: 28px;
    height: 28px;
    flex-shrink: 0;
  }

  .social-card__icon svg {
    width: 100%;
    height: 100%;
    fill: var(--text);
  }

  .social-card__platform {
    font-family: 'Barlow Condensed', sans-serif;
    font-weight: 600;
    font-size: 1.25rem;
    letter-spacing: 0.01em;
    margin: 0 0 2px;
  }

  .social-card__handle {
    color: var(--muted);
    font-size: 0.95rem;
    margin: 0;
  }

  .social-card__cta {
    font-size: 0.9rem;
    color: var(--accent);
    font-weight: 600;
  }

  @media (prefers-reduced-motion: reduce) {
    .social-card { transition: none; }
  }
</style>
     <script defer src="https://cloud.umami.is/script.js" data-website-id="50825f8e-6e07-4776-b9a5-48060f2df6e4"></script>
</head>
<body>

<nav>
  <a href="/">Home</a>
  <a href="/about-ben">About Ben</a>
  <a href="/news">News</a>
  <a href="/follow-us" class="active">Follow Us</a>
</nav>

<section class="social-follow" aria-labelledby="follow-us-heading">
  <div class="social-follow__inner">
    <h2 class="social-follow__label" id="follow-us-heading">Find District Combatives on <span>Social Media</span></h2>
    <p class="social-follow__sub"></p>

    <div class="social-grid">

      <!-- X / Twitter -->
      <a class="social-card" href="https://x.com/dccombatives" target="_blank" rel="noopener noreferrer">
        <div>
          <div class="social-card__icon" aria-hidden="true">
            <svg viewBox="0 0 24 24"><path d="M18.9 2H22l-7.6 8.7L23.3 22h-7.2l-5.6-7.3L4 22H1l8.1-9.3L0.9 2h7.4l5.1 6.7L18.9 2Zm-1.3 18h1.9L6.5 4H4.5l13.1 16Z"/></svg>
          </div>
          <p class="social-card__platform">X</p>
          <p class="social-card__handle">@dccombatives</p>
        </div>
        <span class="social-card__cta">Follow on X →</span>
      </a>

      <!-- Instagram: district.combatives -->
      <a class="social-card" href="https://www.instagram.com/district.combatives/" target="_blank" rel="noopener noreferrer">
        <div>
          <div class="social-card__icon" aria-hidden="true">
            <svg viewBox="0 0 24 24"><path d="M12 2c2.7 0 3.06.01 4.12.06 1.06.05 1.79.22 2.43.47.66.26 1.22.6 1.77 1.15.55.55.9 1.11 1.15 1.77.25.64.42 1.37.47 2.43C21.99 8.94 22 9.3 22 12c0 2.7-.01 3.06-.06 4.12-.05 1.06-.22 1.79-.47 2.43a4.9 4.9 0 0 1-1.15 1.77 4.9 4.9 0 0 1-1.77 1.15c-.64.25-1.37.42-2.43.47-1.06.05-1.42.06-4.12.06s-3.06-.01-4.12-.06c-1.06-.05-1.79-.22-2.43-.47a4.9 4.9 0 0 1-1.77-1.15 4.9 4.9 0 0 1-1.15-1.77c-.25-.64-.42-1.37-.47-2.43C2.01 15.06 2 14.7 2 12s.01-3.06.06-4.12c.05-1.06.22-1.79.47-2.43.26-.66.6-1.22 1.15-1.77A4.9 4.9 0 0 1 5.45.53C6.09.28 6.82.11 7.88.06 8.94.01 9.3 0 12 0Zm0 5a5 5 0 1 1 0 10 5 5 0 0 1 0-10Zm0 2a3 3 0 1 0 0 6 3 3 0 0 0 0-6Zm5.25-3.5a1.17 1.17 0 1 1 0 2.34 1.17 1.17 0 0 1 0-2.34Z"/></svg>
          </div>
          <p class="social-card__platform">Instagram</p>
          <p class="social-card__handle">@district.combatives</p>
        </div>
        <span class="social-card__cta">Follow on Instagram →</span>
      </a>

      <!-- Facebook -->
      <a class="social-card" href="https://www.facebook.com/people/District-Combatives/61594872472032/" target="_blank" rel="noopener noreferrer">
        <div>
          <div class="social-card__icon" aria-hidden="true">
            <svg viewBox="0 0 24 24"><path d="M22 12a10 10 0 1 0-11.56 9.88v-6.99H7.9V12h2.54V9.8c0-2.5 1.49-3.89 3.78-3.89 1.1 0 2.24.2 2.24.2v2.46h-1.26c-1.24 0-1.63.77-1.63 1.56V12h2.78l-.44 2.89h-2.34v6.99A10 10 0 0 0 22 12Z"/></svg>
          </div>
          <p class="social-card__platform">Facebook</p>
          <p class="social-card__handle">District Combatives</p>
        </div>
        <span class="social-card__cta">Follow on Facebook →</span>
      </a>

    </div>
  </div>
</section>
<p style="text-align:center; font-size:0.8rem; color:#9195A0; padding:16px 24px;">This site uses anonymous analytics to count visitors.</p>
</body>
</html>
